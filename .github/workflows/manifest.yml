name: Manifest

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  contribs:
    runs-on: ubuntu-latest
    name: Manifest
    steps:
      # action-manifest loads west.yml via the GitHub API (PR/base blobs). Do not
      # checkout pull_request.head.sha in pull_request_target — that runs untrusted
      # code in a job that can use the workflow token (pwn-request risk).
      - name: Manifest
        uses: zephyrproject-rtos/action-manifest@16c4cfa380ae2b6fa3daddb1a35032e69422a20f
        with:
          github-token: ${{ github.token }}
          manifest-path: 'west.yml'
          label-prefix: 'manifest-'
          verbosity-level: '1'

          # Add one label per line. 'manifest' always adds the label 'manifest'.
          # 'CI-all-test:zephyr;nrfxlib,' adds the 'CI-all-test' label when the
          # zephyr module or the nrfxlib module is changed. Each line is comma-
          # separated.
          labels: >
            manifest
            manifest-nrfxlib:nrfxlib
          dnm-labels: 'DNM'
