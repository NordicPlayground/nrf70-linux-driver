name: Linux build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # Latest kernel versions won't work for nRF70 driver, build against
    # pinned jammy 5.15 headers instead of the runner's own kernel. Newer
    # 5.15 updates (seen on -198) backport array_size.h and break the build.
    container: ubuntu:22.04
    env:
      KVER: 5.15.0-130-generic

    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler git \
            linux-headers-${KVER} python3-pip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-doc-pip

      - name: Install python dependencies
        run: |
          pip3 install setuptools
          pip3 install wheel
          pip3 install python-magic lxml junitparser gitlint pylint pykwalify yamllint
          pip3 install west

      - name: west setup
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git config --global --add safe.directory '*'
          git remote -v
          west init -l . || true
          west update 2>&1 1> west.update.log || west update 2>&1 1> west.update2.log

      - name: make
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          KROOT=/usr/src/linux-headers-${KVER}
          make clean all KROOT=${KROOT} 2>&1 1> make.log
          make clean all KROOT=${KROOT} LOW_POWER=1 2>&1 1> make_lpm.log
          make clean all KROOT=${KROOT} MODE=RADIO-TEST 2>&1 1> make_rt.log

      - name: upload-results
        uses: actions/upload-artifact@v4
        # Always collect artifacts, even if the build failed
        if: always()
        continue-on-error: true
        with:
          name: build-results
          path: |
            make.log
            make_lpm.log
            make_rt.log
            west.update.log
            west.update2.log
